version: 2

models:
  - name: bronze_sales #  Must match the filename of a model -- including case sensitivity.
    config:
        materialized: view
    columns:
      - name: sales_id
        data_tests:
          - not_null
          - unique
      

  - name: bronze_date
    config:
      materialized: view

  - name: bronze_store
    config:
        materialized: view
    columns:
      - name: store_name
        data_tests:
          - accepted_values:
              arguments:
                values: ['MegaMart Manhattan', 'MegaMart Brooklyn', 'MegaMart Austin', 'MegaMart San Jose', 'MegaMart Toronto']
              config:
                severity: warn
            